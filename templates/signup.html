<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Inventory Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px 0;
        }
        .signup-card { 
            width: 100%; 
            max-width: 450px; 
            border: none; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>

<div class="card signup-card p-4">
    <div class="text-center mb-3">
        <i class="fa-solid fa-user-plus fa-3x text-primary mb-2"></i>
        <h4 class="fw-bold">Create an Account</h4>
        <p class="text-muted small">Register to start managing inventory</p>
    </div>

    {% if error %}
    <div class="alert alert-danger p-2 small text-center mb-3">
        {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('signup') }}" method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Full Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" name="name" class="form-control" placeholder="John Doe" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">
            <i class="fa-solid fa-user-check me-2"></i>Sign Up
        </button>

        <div class="text-center">
            <span class="small text-muted">Already have an account?</span>
            <a href="{{ url_for('login') }}" class="small fw-bold text-decoration-none ms-1">Log In</a>
        </div>
    </form>
</div>

</body>
</html>
