<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Inventory Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .otp-card { 
            width: 100%; 
            max-width: 400px; 
            border: none; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>

<div class="card otp-card p-4">
    <div class="text-center mb-4">
        <i class="fa-solid fa-key-skeleton fa-3x text-primary mb-2"></i>
        <h4 class="fw-bold">Enter OTP Code</h4>
        <p class="text-muted small">We sent a 6-digit code to your email address</p>
    </div>

    {% if error %}
    <div class="alert alert-danger p-2 small text-center mb-3">
        {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('verify_otp') }}" method="POST">
        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">6-Digit Verification Code</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                <input type="text" name="otp" class="form-control text-center fs-5 fw-bold letter-spacing" maxlength="6" placeholder="123456" required autofocus>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">
            <i class="fa-solid fa-check-circle me-2"></i>Verify & Register
        </button>
    </form>
</div>

</body>
</html>
