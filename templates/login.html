<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .login-card { 
            width: 100%; 
            max-width: 400px; 
            border: none; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>

<div class="card login-card p-4">
    <div class="text-center mb-4">
        <i class="fa-solid fa-boxes-stacked fa-3x text-primary mb-2"></i>
        <h4 class="fw-bold">Inventory Manager</h4>
        <p class="text-muted small">Sign in to manage your inventory</p>
    </div>

    {% if error %}
    <div class="alert alert-danger p-2 small text-center mb-3">
        {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold small text-muted">Username or Email</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Enter username or email" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Log In
        </button>

        <div class="text-center">
            <span class="small text-muted">Don't have an account?</span>
            <a href="{{ url_for('signup') }}" class="small fw-bold text-decoration-none ms-1">Sign Up</a>
        </div>
    </form>
</div>

</body>
</html>
